<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifier le Profil | FreelanceLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-auto flex items-center justify-center">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Modifier le profil</h1>
    
    <form id="editForm" class="space-y-4">
      <div>
        <label class="block font-medium mb-1">Nom complet</label>
        <input type="text" id="name" class="w-full border border-orange-500 p-2 rounded-lg focus:ring focus:ring-orange-400">
      </div>

      <div>
        <label class="block font-medium mb-1">Bio</label>
        <textarea id="bio" rows="4" class="w-full border border-orange-500 p-2 rounded-lg focus:ring focus:ring-orange-400"></textarea>
      </div>

      <div>
        <label class="block font-medium mb-1">Tarif ($/h)</label>
        <input type="number" id="rate" class="w-full border border-orange-500 p-2 rounded-lg focus:ring focus:ring-orange-400">
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg transition">
        Enregistrer les modifications
      </button>
    </form>
  </div>

  <script src="modefection.js"></script>
</body>
</html>
